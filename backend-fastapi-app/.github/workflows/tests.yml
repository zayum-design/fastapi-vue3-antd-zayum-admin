# =============================================================================
# GitHub Actions CI 配置
# =============================================================================
# 描述: 自动化运行测试套件
# 触发条件:
#   - push 到 main/develop 分支
#   - pull request 到 main/develop 分支
# =============================================================================

name: Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend-fastapi-app/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend-fastapi-app/**'

jobs:
  # 单元测试作业
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend-fastapi-app
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
    
    - name: Run unit tests
      run: |
        pytest tests/unit -v -m unit --tb=short --junitxml=unit-test-results.xml
    
    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: backend-fastapi-app/unit-test-results.xml

  # 集成测试作业
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    defaults:
      run:
        working-directory: ./backend-fastapi-app
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
    
    - name: Run integration tests
      run: |
        pytest tests/integration -v -m integration --tb=short --junitxml=integration-test-results.xml
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: backend-fastapi-app/integration-test-results.xml

  # 覆盖率报告作业
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    defaults:
      run:
        working-directory: ./backend-fastapi-app
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
    
    - name: Generate coverage report
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=term --tb=short
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend-fastapi-app/coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend-fastapi-app/coverage.xml

  # 代码质量检查
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check code formatting with black
      working-directory: ./backend-fastapi-app
      run: |
        black --check --diff app/ tests/
      continue-on-error: true
    
    - name: Check import sorting with isort
      working-directory: ./backend-fastapi-app
      run: |
        isort --check-only --diff app/ tests/
      continue-on-error: true
    
    - name: Lint with flake8
      working-directory: ./backend-fastapi-app
      run: |
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
