[pytest]
# 测试发现配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试支持
asyncio_mode = auto

# 输出配置
verbosity = 2
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 自定义标记
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试
    auth: 认证相关测试
    security: 安全相关测试
    api: API 测试
    crud: CRUD 操作测试

# 覆盖率配置（可选）
# addopts = --cov=app --cov-report=term-missing --cov-report=html

# 环境变量
env =
    ENV=testing
    TESTING=true
    SECRET_KEY=test_secret_key_for_testing_only
